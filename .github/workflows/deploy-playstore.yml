name: Deploy to Google Play Store

on:
  push:
    tags:
      - 'v*.*.*'  # Dispara quando criar tag como v5.0.1
  workflow_dispatch:  # Permite executar manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
        channel: 'stable'
        
    - name: Instalar dependências
      run: flutter pub get
      
    - name: Criar supabase_config.dart
      run: |
        mkdir -p lib/config
        cat > lib/config/supabase_config.dart << 'EOF'
        // Configuração do Supabase (gerado automaticamente pelo CI)
        class SupabaseConfig {
          static const String url = '${{ secrets.SUPABASE_URL }}';
          static const String anonKey = '${{ secrets.SUPABASE_ANON_KEY }}';
        }
        EOF
    
    - name: Criar admob_config.dart
      run: |
        mkdir -p lib/config
        cat > lib/config/admob_config.dart << 'EOF'
        /// Configuração do Google AdMob (gerado automaticamente pelo CI)
        class AdMobConfig {
          static const String androidAppId = '${{ secrets.ADMOB_APP_ID }}';
          static const String bannerAdUnitId = '${{ secrets.ADMOB_BANNER_UNIT_ID }}';
          static const String testBannerAdUnitId = 'ca-app-pub-3940256099942544/6300978111';
          static const String testAppId = 'ca-app-pub-3940256099942544~3347511713';
        }
        EOF
    
    - name: Verificar supabase_config.dart criado
      run: |
        echo "Verificando arquivo supabase_config.dart..."
        if [ ! -f lib/config/supabase_config.dart ]; then
          echo "❌ ERRO: Arquivo não foi criado!"
          exit 1
        fi
        echo "✅ Arquivo criado. Conteúdo (secrets mascaradas):"
        cat lib/config/supabase_config.dart | sed 's/\(url = \).*/\1"[MASKED]"/g' | sed 's/\(anonKey = \).*/\1"[MASKED]"/g'
        
        # Verifica se URL não está vazia
        if grep -q "url = '';" lib/config/supabase_config.dart; then
          echo "❌ ERRO: SUPABASE_URL está vazia! Configure a secret no GitHub."
          exit 1
        fi
        
        # Verifica se anonKey não está vazia
        if grep -q "anonKey = '';" lib/config/supabase_config.dart; then
          echo "❌ ERRO: SUPABASE_ANON_KEY está vazia! Configure a secret no GitHub."
          exit 1
        fi
        
        echo "✅ Secrets do Supabase configuradas corretamente!"
    
    - name: Verificar admob_config.dart criado
      run: |
        echo "Verificando arquivo admob_config.dart..."
        if [ ! -f lib/config/admob_config.dart ]; then
          echo "❌ ERRO: Arquivo admob_config.dart não foi criado!"
          exit 1
        fi
        echo "✅ Arquivo criado. Conteúdo (IDs mascarados):"
        cat lib/config/admob_config.dart | sed 's/\(androidAppId = \).*/\1"[MASKED]"/g' | sed 's/\(bannerAdUnitId = \).*/\1"[MASKED]"/g'
        
        # Verifica se App ID não está vazio
        if grep -q "androidAppId = '';" lib/config/admob_config.dart; then
          echo "❌ ERRO: ADMOB_APP_ID está vazio! Configure a secret no GitHub."
          exit 1
        fi
        
        # Verifica se Banner Unit ID não está vazio
        if grep -q "bannerAdUnitId = '';" lib/config/admob_config.dart; then
          echo "❌ ERRO: ADMOB_BANNER_UNIT_ID está vazio! Configure a secret no GitHub."
          exit 1
        fi
        
        echo "✅ IDs do AdMob configurados corretamente!"
      
    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
        
    - name: Criar key.properties
      run: |
        cat > android/key.properties << EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=upload-keystore.jks
        EOF
        
    - name: Build App Bundle
      run: flutter build appbundle --release
      
    - name: Ler notas de versão
      id: release_notes
      run: |
        # Lê arquivo de release notes (pode ser RELEASES.md ou específico da versão)
        if [ -f "RELEASE_NOTES.txt" ]; then
          NOTES=$(cat RELEASE_NOTES.txt)
        elif [ -f "RELEASES.md" ]; then
          # Extrai a última versão do RELEASES.md
          NOTES=$(sed -n '/^## \[/,/^## \[/p' RELEASES.md | sed '$d' | tail -n +2)
        else
          NOTES="Nova versão disponível"
        fi
        
        # Salva em arquivo para o próximo step
        echo "$NOTES" > release_notes.txt
        echo "notes_file=release_notes.txt" >> $GITHUB_OUTPUT
        
    - name: Upload para Google Play Store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: br.com.arnapio
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        track: production  # Opções: internal, alpha, beta, production
        status: completed  # Opções: draft, completed
        whatsNewDirectory: play_store/whatsnew/
        mappingFile: build/app/outputs/mapping/release/mapping.txt
