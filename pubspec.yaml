publish_to: 'none'
version: 5.0.3+18

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  device_info_plus: ^10.0.0
  supabase_flutter: ^2.2.0

